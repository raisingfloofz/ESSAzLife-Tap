<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#B7410E"><title>ESSAzLife: Tap</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2939;background:#f3f5f8;--rust:#B7410E}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:760px;min-height:100dvh;margin:auto;background:#f8fafc;display:flex;flex-direction:column;box-shadow:0 0 25px #0001}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:750;letter-spacing:-.025em}.tiny,.muted{color:#667085}.tiny,.small{font-size:13px}.content{flex:1;padding:18px;overflow:auto}.content h1{font-size:24px;margin:4px 0 12px}.content h2{font-size:18px;margin:4px 0 10px}.card{border-radius:13px;border:1px solid #e4e7ec;background:white;padding:15px;margin:12px 0}.btn{border:0;border-radius:10px;background:var(--rust);color:#fff;font-weight:650;padding:12px 15px;min-height:44px}.btn.alt{border:1px solid #d0d5dd;background:#fff;color:#1d2939}.btn:disabled{opacity:.45}.footer{padding:12px 16px;background:#fff;border-top:1px solid #e4e7ec;display:flex;gap:10px}.footer .btn{flex:1}.field{display:block;font-weight:600;margin:12px 0}.field input,.field select{display:block;width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:12px;margin-top:6px;background:white}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:15px;margin:9px 0;color:#1d2939}.choice strong{display:block}.choice small{color:#667085}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{font:12px ui-monospace,monospace;background:#f2f4f7;padding:5px;border-radius:6px;overflow-wrap:anywhere}.notice{padding:12px;border-radius:10px;background:#fff4ed;border:1px solid #ffd5bb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .btn{width:100%}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.overlay.show{display:flex}.dialog{background:white;border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 70px #0003}.scanresult{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:white;font-size:120px;font-weight:800;z-index:30}.scanresult.show{display:flex}.scanresult.ok{background:#17813bdc}.scanresult.bad{background:#c72d32dc}.meter{height:12px;border-radius:9px;background:#e5e7eb;overflow:hidden}.meter span{display:block;height:100%;background:var(--rust)}input[type=range]{width:100%;accent-color:var(--rust)}.log{max-height:200px;overflow:auto;font-size:13px}.pill{display:inline-block;background:#fff0e7;color:#8b3009;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700}.status{font-weight:700;color:var(--rust)}@media(max-width:749px){.top{padding:10px 14px}.content{padding:12px 14px}.footer{padding:8px 14px}.card{padding:12px}.content h1{font-size:22px}}
</style></head><body><div id="app"></div><div id="overlay" class="overlay"><div class="dialog" id="dialog"></div></div><div id="scanresult" class="scanresult"></div>
<script>
'use strict';
const KEY='essazlife-tap-v1', RUST='#B7410E';
const DEFAULT_TAGS={bowl:'ESSAZ-BOWL',leash:'ESSAZ-LEASH',brush:'ESSAZ-BRUSH',medicine:'ESSAZ-MEDICINE',soap:'ESSAZ-SOAP',thermometer:'ESSAZ-THERMOMETER',bed:'ESSAZ-BED'};
const FILES={correct:'sounds/caregiver-detected.wav',registered:'sounds/caregiver-registered.wav',lost:'sounds/points-lost.wav',pass:'sounds/passing.mp3',fail:'sounds/failing.m4a',dogbark:'dogsounds/big.dog.bark.wav',puppybark:'dogsounds/small.dog.bark.flac',dogwhine:'dogsounds/whine.wav',puppywhine:'dogsounds/puppy.whining.wav',puppycry:'dogsounds/puppy.crying.wav',puppyhunger:'dogsounds/puppy.hungry.wav',dogtalk:'dogsounds/dog.talkback.wav',dogfood:'dogsounds/eating.treat.wav',puppyfood:'dogsounds/puppy.eating.wav',dogwater:'dogsounds/dog.drinking.wav',puppywater:'dogsounds/puppy.drinking.wav',dogplay:'dogsounds/dog.playing.wav',puppyplay:'dogsounds/puppy.playing.wav',dogsleep:'dogsounds/snoringdog.wav',catmeow:'catsounds/Meow.wav',kittenmeow:'catsounds/kitten.mew.wav',cathunger:'catsounds/hungry.cat.wav',kittenhunger:'catsounds/hungry.kitten.mp3',catfood:'catsounds/cat-eating.wav',kittenfood:'catsounds/cat-eating.wav',catwater:'catsounds/cat-drinking.wav',kittenwater:'catsounds/cat-drinking.wav',catplay:'catsounds/wantstoplay.cat.mp3',kittenplay:'catsounds/chirps.wav',catpurr:'catsounds/happy cat.wav',kittenpurr:'catsounds/kitten.purr.meow.wav',catsneeze:'catsounds/sneeze.wav',dogill:'dogsounds/dog.sick.wav'};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{} db=db||{handlers:[],essas:[],tags:{...DEFAULT_TAGS},brushes:{short:'ESSAZ-BRUSH',long:''},toys:['','',''],settings:{sound:true,unit:'F'},reports:[]};
db.tags={...DEFAULT_TAGS,...db.tags};db.settings=db.settings||{sound:true,unit:'F'};db.brushes=db.brushes||{short:'ESSAZ-BRUSH',long:''};db.toys=db.toys||['','',''];
let page='home',session=null,scanner=null,scanning=false,pending=null,activeAudio=null,ambientAudio=null,loopTimer=null,needTimer=null,careTimer=null,lastTag='',lastTagAt=0,selectedEssa=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2,11);
function screen(html,buttons=[]){$('app').innerHTML=`<main class="shell"><header class="top"><div><div class="brand">ESSAzLife Tap</div><div class="tiny">NFC-powered ESSA care</div></div><button class="btn alt" onclick="home()">Home</button></header><section class="content">${html}</section><footer class="footer">${buttons.map((b,i)=>`<button class="btn ${b.alt?'alt':''}" id="action${i}">${esc(b.label)}</button>`).join('')}</footer></main>`;buttons.forEach((b,i)=>$('action'+i).onclick=b.fn)}
function modal(html){$('dialog').innerHTML=html;$('overlay').classList.add('show')}
function closeModal(){$('overlay').classList.remove('show')}
function feedback(ok){let x=$('scanresult');x.className='scanresult show '+(ok?'ok':'bad');x.textContent=ok?'✓':'×';setTimeout(()=>x.className='scanresult',850)}
function play(key,loop=false){if(!db.settings.sound||!FILES[key])return;stopAudio();let a=new Audio(encodeURI(FILES[key]));a.loop=loop;a.volume=.8;activeAudio=a;a.play().catch(()=>{});if(key==='dogsleep'){a.loop=false;a.addEventListener('timeupdate',()=>{if(a.currentTime>=19)a.currentTime=0})}return a}
function stopAudio(){clearTimeout(loopTimer);if(activeAudio){activeAudio.pause();activeAudio=null}}
function stopAmbient(){if(ambientAudio){ambientAudio.pause();ambientAudio=null}}
function vocal(){if(!session?.running||!session.need||session.focused)return;let k=session.essa.kind;let key={puppy:'puppyhunger',dog:'dogwhine',kitten:'kittenhunger',cat:'cathunger'}[k];if(session.held&&(k==='puppy'||k==='dog'))return;play(key);if(k==='puppy'){const a=activeAudio;if(a)a.onended=()=>{if(session?.running&&session.need&&!session.held)loopTimer=setTimeout(vocal,5000)}}else{const a=activeAudio;if(a)a.onended=()=>{if(session?.running&&session.need)loopTimer=setTimeout(vocal,3500)}}}
function home(){if(session?.running&&!confirm('End the current simulation and return home?'))return;stopSession(false);page='home';render()}
function render(){if(page==='home')return homeScreen();if(page==='handlers')return handlersScreen();if(page==='essas')return essasScreen();if(page==='accessories')return accessoriesScreen();if(page==='modes')return modesScreen();if(page==='settings')return settingsScreen();if(page==='reports')return reportsScreen();if(page==='live')return liveScreen();if(page==='prepare')return prepareScreen()}
function homeScreen(){screen(`<h1>Welcome to ESSAzLife Tap.</h1><p class="muted">Care for your ESSA, one tap at a time.</p><div class="card"><h2>Get started</h2><p>Set up handlers, ESSAs, and NFC accessories. Then choose a simulation.</p></div><button class="choice" onclick="page='handlers';render()"><strong>Handler Settings</strong><small>Register and manage caregiver bands</small></button><button class="choice" onclick="page='essas';render()"><strong>ESSA Profiles</strong><small>Add puppies, dogs, kittens, and cats</small></button><button class="choice" onclick="page='accessories';render()"><strong>NFC Accessories</strong><small>Register Bowl, Leash, Brush, and more</small></button><button class="choice" onclick="page='modes';render()"><strong>Choose a Simulation</strong><small>Demo, Classic, Comfort, Quick Play, Plush, Daycare</small></button><button class="choice" onclick="page='reports';render()"><strong>Report Cards</strong><small>Review previous simulations</small></button><button class="choice" onclick="page='settings';render()"><strong>Settings</strong><small>Sounds, temperature, and saved data</small></button>`,[{label:'Choose a Simulation',fn:()=>{page='modes';render()}}])}
function handlersScreen(){screen(`<h1>Handler Settings</h1><div class="card"><h2>Add Handler</h2><label class="field">Handler name<input id="hname" placeholder="Name"></label><label class="field">Relationship<select id="hrole">${['Handler','Mom','Dad','Grandma','Grandpa','Guardian','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><button class="btn" onclick="addHandler()">Add Handler</button></div>${db.handlers.map((h,i)=>`<div class="card"><div class="row"><strong>${esc(h.name)} (${esc(h.role)})</strong><button class="btn alt" onclick="removeHandler(${i})">Remove</button></div><p class="tag">${esc(h.tag)}</p><button class="btn alt" onclick="register('handler',${i})">Scan Caregiver Band</button></div>`).join('')}`, [{label:'Back',alt:true,fn:home}])}
function addHandler(){let name=$('hname').value.trim();if(!name)return alert('Enter a handler name.');db.handlers.push({name,role:$('hrole').value,tag:'ESSAZ-CAREGIVER-'+String(db.handlers.length+1).padStart(3,'0')});save();render()}
function removeHandler(i){if(confirm('Remove this handler?')){db.handlers.splice(i,1);save();render()}}
function essasScreen(){screen(`<h1>ESSA Profiles</h1><div class="card"><h2>Add ESSA</h2><label class="field">ESSA name<input id="ename" placeholder="Name"></label><label class="field">Select species — this will affect the availability of sounds<select id="ekind"><option value="puppy">Puppy</option><option value="dog">Adult Dog</option><option value="kitten">Kitten</option><option value="cat">Adult Cat</option></select></label><button class="btn" onclick="addEssa()">Add ESSA</button></div>${db.essas.map((e,i)=>`<div class="card"><div class="row"><strong>${esc(e.name)}</strong><button class="btn alt" onclick="removeEssa(${i})">Remove</button></div><label class="field">Species<select onchange="db.essas[${i}].kind=this.value;save()">${[['puppy','Puppy'],['dog','Adult Dog'],['kitten','Kitten'],['cat','Adult Cat']].map(([k,n])=>`<option value="${k}" ${e.kind===k?'selected':''}>${n}</option>`).join('')}</select></label></div>`).join('')}`,[{label:'Back',alt:true,fn:home}])}
function addEssa(){let name=$('ename').value.trim();if(!name)return alert('Enter a name.');db.essas.push({id:id(),name,kind:$('ekind').value});save();render()}
function removeEssa(i){if(confirm('Remove this ESSA?')){db.essas.splice(i,1);save();render()}}
function accessoriesScreen(){let items=[['bowl','Bowl'],['leash','Leash'],['brush','Brush'],['medicine','Medicine'],['soap','Soap'],['thermometer','Thermometer'],['bed','Bed']];screen(`<h1>Register NFC Accessories</h1><p class="muted">Bowl, Leash, and Brush come first. Existing Babiez tags can be reused.</p>${items.map(([k,n])=>`<div class="card"><div class="row"><strong>${n}</strong><button class="btn alt" onclick="register('item','${k}')">Scan Tag</button></div><p class="tag">${esc(db.tags[k]||'Not registered')}</p></div>`).join('')}<div class="card"><h2>Brush Types</h2><p class="small muted">Your single brush tag works now. A second can be registered later.</p>${['short','long'].map(k=>`<div class="row" style="margin:10px 0"><span>${k==='short'?'Short-haired':'Long-haired'} brush<br><small class="tag">${esc(db.brushes[k]||'Not registered')}</small></span><button class="btn alt" onclick="register('brush','${k}')">Scan</button></div>`).join('')}</div><div class="card"><h2>Three Toys</h2>${db.toys.map((t,i)=>`<div class="row" style="margin:12px 0"><span>Toy ${i+1}<br><small class="tag">${esc(t||'Not registered')}</small></span><button class="btn alt" onclick="register('toy',${i})">Scan</button></div>`).join('')}</div>`,[{label:'Back',alt:true,fn:home}])}
function register(type,index){pending={type,index};modal(`<h2>Scan NFC Tag</h2><p>Hold the tag against your phone to register it.</p><p class="small muted">Web NFC requires Android Chrome, HTTPS, and an unlocked phone.</p><button class="btn" onclick="startNfc()">Enable NFC Scanner</button> <button class="btn alt" onclick="closeModal();pending=null">Cancel</button>`);startNfc()}
function readText(event){for(const record of event.message.records){try{if(record.recordType==='text')return new TextDecoder(record.encoding||'utf-8').decode(record.data).replace(/^\uFEFF/,'').trim()}catch{}}return event.serialNumber||''}
async function startNfc(){if(scanning)return;if(!('NDEFReader'in window)){alert('Web NFC requires Android Chrome on an HTTPS website.');return}try{scanner=new NDEFReader();await scanner.scan();scanning=true;scanner.addEventListener('reading',e=>{let value=readText(e);if(value)receiveTag(value)});scanner.addEventListener('readingerror',()=>alert('Could not read tag. Try again.'));closeModal()}catch(e){alert('NFC could not start: '+e.message)}}
function receiveTag(value){let now=Date.now();if(lastTag===value&&now-lastTagAt<1200)return;lastTag=value;lastTagAt=now;if(pending){let p=pending;pending=null;if(p.type==='handler')db.handlers[p.index].tag=value;else if(p.type==='item')db.tags[p.index]=value;else if(p.type==='brush')db.brushes[p.index]=value;else if(p.type==='toy')db.toys[p.index]=value;save();play('registered');feedback(true);render();return}if(session?.running)handleTag(value)}
function modesScreen(){if(!db.essas.length||!db.handlers.length){screen(`<h1>Choose a Simulation</h1><p class="notice">Please add at least one handler and one ESSA first.</p>`,[{label:'Set Up',fn:()=>{page='home';render()}}]);return}screen(`<h1>Choose a Simulation</h1><label class="field">ESSA<select id="selectedEssa">${db.essas.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.kind)}</option>`).join('')}</select></label><label class="field">Handler<select id="selectedHandler">${db.handlers.map((h,i)=>`<option value="${i}">${esc(h.name)} (${esc(h.role)})</option>`).join('')}</select></label>${[['demo','Demo','Guided practice'],['classic','Classic Mode','Regular ESSA care'],['comfort','Comfort Mode','Gentle care with relaxed timing'],['quick','Quick Play','A shorter simulation'],['plush','Plush Mode','NFC-only care after setup'],['daycare','Daycare Mode','Care with scheduled quiet periods']].map(([k,n,d])=>`<button class="choice" onclick="chooseMode('${k}')"><strong>${n}</strong><small>${d}</small></button>`).join('')}`,[{label:'Back',alt:true,fn:home}])}
function chooseMode(mode){let e=db.essas.find(x=>x.id===$('selectedEssa').value),h=db.handlers[+$('selectedHandler').value];session={mode,essa:e,handler:h,score:100,events:[],running:false,need:null,held:false,focused:false,focusKind:'',paused:false,foodCups:.5,started:0,completed:0,wrong:0};page='prepare';render()}
function prepareScreen(){screen(`<h1>Prepare ${esc(session.essa.name)}</h1><div class="card"><p><strong>Mode:</strong> ${esc(session.mode)}</p><p><strong>Handler:</strong> ${esc(session.handler.name)}</p><p><strong>Species:</strong> ${esc(session.essa.kind)}</p><p class="small muted">Feedings: ${['puppy','kitten'].includes(session.essa.kind)?4:2} daily. Water is available throughout the day.</p></div><p class="notice">Keep Tap open and your phone unlocked for NFC care. For Plush Mode, use the caregiver band and accessory tags; manual entry is optional.</p><button class="btn alt" onclick="startNfc()">Enable NFC Scanner</button>`,[{label:'Back',alt:true,fn:()=>{page='modes';render()}},{label:"I'm Ready",fn:beginSession}])}
function beginSession(){session.running=true;session.started=Date.now();page='live';render();startNfc();setTimeout(()=>{if(session?.running&&!session.focused&&!session.need)createNeed()},session.mode==='demo'?1500:session.mode==='quick'?5000:12000)}
const needs=['food','water','potty','play','groom','rest','medicine','temperature'];
function createNeed(){if(!session?.running||session.paused||session.focused||session.need)return;let pool=session.mode==='comfort'?['food','water','play','rest']:needs;session.need=pool[Math.floor(Math.random()*pool.length)];session.held=false;session.wrong=0;session.due=Date.now();vocal();render()}
function liveScreen(){if(!session?.running)return home();let s=session;screen(`<h1>${esc(s.essa.name)} — ${esc(s.mode)}</h1><div class="card"><div class="row"><strong>${s.focused?'Focused: '+esc(s.focusKind):s.need?'Your ESSA needs care':'Your ESSA is content'}</strong><span class="pill">${esc(s.essa.kind)}</span></div><p class="small muted">${s.focused?'Care requests and penalties are paused.':s.held?'Handler is holding the ESSA.':s.need?'Scan your caregiver band, then an accessory.':'Waiting for the next care request.'}</p><div class="row"><span>Score</span><strong>${s.score}/100</strong></div><div class="meter"><span style="width:${s.score}%"></span></div></div><div class="card"><h2>NFC Care</h2><p>First caregiver scan: holding. Second caregiver scan: Manual Entry? Scan caregiver + leash to toggle outings or work.</p><p class="tag">Caregiver: ${esc(s.handler.tag)}</p><button class="btn alt" onclick="startNfc()">Enable NFC</button> <button class="btn alt" onclick="manualEntry()">Manual Entry</button></div>${s.focused?`<div class="notice">Focused state active. Scan caregiver band and leash again to finish.</div>`:''}${s.mode==='demo'?`<div class="notice">Demo hint: ${esc(s.need||'Wait for a care request')}</div>`:''}<div class="card"><h2>Session History</h2><div class="log">${s.events.slice(-12).reverse().map(e=>`<p>${esc(e.time)} — ${esc(e.text)}</p>`).join('')||'No activities yet.'}</div></div>`,[{label:'End & Report',fn:()=>stopSession(true)}])}
function eventLog(text){if(!session)return;session.events.push({time:new Date().toLocaleTimeString(),text});render()}
function handleTag(tag){let s=session;if(!s||!s.running)return;let handler=db.handlers.find(h=>h.tag===tag)||tag==='ESSAZ-CAREGIVER-DEMO'?db.handlers.find(h=>h.tag===tag)||s.handler:null;if(handler){if(s.awaitLeash){s.awaitLeash=false}s.held=true;stopAudio();if(s.need&&['cat','kitten'].includes(s.essa.kind))vocal();if(s.holdingOnce){s.holdingOnce=false;manualPrompt()}else{s.holdingOnce=true;eventLog('Handler holding ESSA');feedback(true)}return}if(tag===db.tags.leash){if(s.held){s.holdingOnce=false;focusPrompt();return}incorrect('Leash scanned without handler');return}let action=null;if(tag===db.tags.bowl)action=s.need==='water'?'water':'food';else if(tag===db.tags.brush||Object.values(db.brushes).includes(tag)&&tag)action='groom';else if(tag===db.tags.medicine)action='medicine';else if(tag===db.tags.soap)action='groom';else if(tag===db.tags.thermometer)action='temperature';else if(tag===db.tags.bed)action='rest';else if(db.toys.includes(tag)&&tag)action='play';if(!action){incorrect('Unknown accessory');return}if(!s.held){incorrect('Scan caregiver band first');return}s.holdingOnce=false;doCare(action)}
function manualPrompt(){modal(`<h2>Manual Entry?</h2><p>Would you like to select a care activity manually?</p><div class="row"><button class="btn alt" onclick="closeModal()">No — Scan an Item</button><button class="btn" onclick="closeModal();manualEntry()">Yes</button></div>`)}
function manualEntry(){if(!session?.running)return;modal(`<h2>Manual Care Entry</h2><p>Choose what you want to do.</p><div class="grid">${needs.map(n=>`<button class="btn alt" onclick="closeModal();doCare('${n}')">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div><p><button class="btn alt" onclick="closeModal()">Cancel</button></p>`)}
function focusPrompt(){let s=session;if(s.focused){modal(`<h2>Finish ${esc(s.focusKind)}?</h2><p>Allow your ESSA to relax and resume care requests?</p><button class="btn" onclick="closeModal();endFocus()">Yes</button> <button class="btn alt" onclick="closeModal()">No</button>`)}else modal(`<h2>Are we on an outing? Or is it time for work?</h2><p>Choose a focused activity. Your ESSA won't request care during it.</p><button class="btn" onclick="startFocus('Outing')">Outing</button> <button class="btn" onclick="startFocus('Work')">Work</button> <button class="btn alt" onclick="closeModal()">No</button>`)}
function startFocus(kind){closeModal();let s=session;s.focused=true;s.focusKind=kind;s.held=false;s.holdingOnce=false;stopAudio();clearTimeout(needTimer);eventLog(kind+' started');feedback(true)}
function endFocus(){let s=session;s.focused=false;s.focusKind='';s.held=false;s.holdingOnce=false;eventLog('Focused session ended');if(s.need)vocal();else scheduleNeed()}
function incorrect(reason){if(!session)return;session.score=Math.max(0,session.score-5);session.wrong++;play('lost');feedback(false);eventLog('Incorrect care: '+reason);if(['dog','puppy'].includes(session.essa.kind)&&session.wrong>=2){setTimeout(()=>play('dogtalk'),1200)}}
function doCare(action){let s=session;if(!s?.running||s.focused)return;if(action==='food'){feedingPicker();return}if(action==='temperature'){thermometer();return}completeCare(action)}
function feedingPicker(){let s=session;modal(`<h2>Prepare Food</h2><p>Choose the amount in cups.</p><p style="font-size:28px;color:var(--rust);font-weight:800;text-align:center" id="cupval">${s.foodCups.toFixed(2)} cups</p><input type="range" id="cups" min=".25" max="3" step=".25" value="${s.foodCups}" oninput="$('cupval').textContent=Number(this.value).toFixed(2)+' cups'"><div class="row"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="session.foodCups=Number($('cups').value);closeModal();completeCare('food')">Feed</button></div>`)}
function thermometer(){let s=session;let temp=s.need==='temperature'?39.8:38.5;let f=db.settings.unit==='F';let display=f?(temp*9/5+32):temp;let high=temp>=39.7,elev=temp>=39.2;let color=high?'#c62828':elev?'#b8860b':'#16843a';modal(`<h2>Thermometer</h2><div style="text-align:center;font-size:36px;font-weight:800;color:${color}">${display.toFixed(1)}°${f?'F':'C'}</div><p style="text-align:center;color:${color}">${high?'High':elev?'Elevated':'Normal'}</p><div class="row"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="closeModal();completeCare('temperature')">Record Temperature</button></div>`)}
function completeCare(action){let s=session;if(!s?.running)return;if(s.need!==action){incorrect(action==='medicine'?'Unnecessary medicine':'Expected '+(s.need||'no care')+', received '+action);return}feedback(true);play('correct');let duration=action==='food'?6500:action==='water'?4500:action==='rest'?5000:2500;let kind=s.essa.kind;let audioKey=action==='food'?(kind+'food'):action==='water'?(kind+'water'):action==='play'?(kind+'play'):action==='rest'&&['dog','puppy'].includes(kind)?'dogsleep':null;let cups=s.foodCups;s.need=null;s.held=false;s.holdingOnce=false;s.completed++;s.score=Math.min(100,s.score+2);eventLog(action+' completed'+(action==='food'?' ('+cups.toFixed(2)+' cups)':''));if(audioKey){setTimeout(()=>{if(s.running){play(audioKey,true);careTimer=setTimeout(()=>{stopAudio();scheduleNeed()},duration)}},400)}else scheduleNeed()}
function scheduleNeed(){clearTimeout(needTimer);if(!session?.running||session.focused)return;let delay=session.mode==='quick'?14000:session.mode==='comfort'?90000:session.mode==='demo'?18000:45000;needTimer=setTimeout(createNeed,delay)}
function stopSession(report){clearTimeout(needTimer);clearTimeout(careTimer);stopAudio();stopAmbient();closeModal();if(!session)return;let s=session;if(s.running){s.running=false;db.reports.unshift({name:s.essa.name,kind:s.essa.kind,mode:s.mode,handler:s.handler.name,score:s.score,completed:s.completed,events:s.events,date:new Date().toLocaleString()});save()}if(report){page='reports';render()}session=null}
function reportsScreen(){screen(`<h1>Report Cards</h1>${db.reports.length?db.reports.map((r,i)=>`<div class="card"><div class="row"><strong>${esc(r.name)}</strong><span class="pill">${r.score}/100</span></div><p class="small muted">${esc(r.date)} · ${esc(r.mode)} · ${esc(r.handler)}</p><p>Completed care: ${r.completed}</p><details><summary>Activity history</summary>${r.events.map(e=>`<p class="small">${esc(e.time)} — ${esc(e.text)}</p>`).join('')}</details></div>`).join(''):'<p>No report cards yet.</p>'}`,[{label:'Back',alt:true,fn:home}])}
function settingsScreen(){screen(`<h1>Settings</h1><div class="card"><h2>Sounds</h2><label><input type="checkbox" ${db.settings.sound?'checked':''} onchange="db.settings.sound=this.checked;save();if(!this.checked)stopAudio()"> Enable sounds</label></div><div class="card"><h2>Temperature Unit</h2><label class="field">Display<select onchange="db.settings.unit=this.value;save()"><option value="F" ${db.settings.unit==='F'?'selected':''}>Fahrenheit (°F)</option><option value="C" ${db.settings.unit==='C'?'selected':''}>Celsius (°C)</option></select></label></div><div class="card"><h2>Refrigerator</h2><p class="muted">Coming in a future update: register and nickname food NFC tags.</p></div><div class="card"><h2>Backup and Restore</h2><button class="btn alt" onclick="backup()">Download Backup</button> <label class="btn alt" style="display:inline-block">Restore Backup<input type="file" accept=".json" hidden onchange="restore(event)"></label></div>`,[{label:'Back',alt:true,fn:home}])}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='essazlife-tap-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function restore(e){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.essas)||!Array.isArray(v.handlers))throw Error('Invalid backup');if(confirm('Replace Tap data with this backup?')){db=v;save();render()}}catch(err){alert('Could not restore: '+err.message)}}
render();
</script></body></html>
